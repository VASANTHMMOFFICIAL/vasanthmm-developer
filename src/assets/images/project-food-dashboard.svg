  <rect width="800" height="600" fill="url(#glow)"/>
  <circle cx="680" cy="500" r="140" fill="rgba(255,255,255,0.06)"/>
  <circle cx="100" cy="80" r="90" fill="rgba(255,255,255,0.07)"/>
